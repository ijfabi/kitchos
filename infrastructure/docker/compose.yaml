name: kitchos
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kitchos
      POSTGRES_USER: kitchos_owner
      POSTGRES_PASSWORD: kitchos_owner_dev
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kitchos_owner -d kitchos']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
